#cloud-config
# Ubuntu 24.04 on Vultr Cloud Compute. Installs Node 22, Caddy and ufw (22, 80, 443 only), creates /opt/forklab.
package_update: true
packages: [curl, ufw, debian-keyring, debian-archive-keyring, apt-transport-https, git]
runcmd:
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update && apt-get install -y caddy
  - ufw default deny incoming && ufw allow 22 && ufw allow 80 && ufw allow 443 && ufw --force enable
  - useradd --system --create-home --home-dir /opt/forklab forklab || true
  - mkdir -p /opt/forklab && chown forklab:forklab /opt/forklab
