[package]
name = "forklab"
version = "0.1.0"
description = "ForkLab: node-level license splits and challenge prize escrow (devnet)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "forklab"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "0.32.1" }
